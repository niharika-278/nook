openapi: 3.0.3
info:
  title: Nook API
  version: 0.1.0
  description: REST API for authentication and the Nook personal library.

security:
  - BearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and bearer token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated and bearer token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: The authenticated user's public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/health:
    get:
      tags: [Health]
      summary: Check API and database health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bookmarks:
    get:
      tags: [Bookmarks]
      summary: List bookmarks
      operationId: listBookmarks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/BookmarkLimit'
        - $ref: '#/components/parameters/CategoryIdFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/ProcessingStatusFilter'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: A paginated list of the authenticated user's bookmarks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Bookmarks]
      summary: Create a bookmark
      operationId: createBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkCreateRequest'
      responses:
        '201':
          description: Bookmark created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The supplied category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The URL is already saved by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bookmarks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Bookmarks]
      summary: Get a bookmark
      operationId: getBookmark
      responses:
        '200':
          description: The requested bookmark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Bookmarks]
      summary: Update a bookmark
      operationId: updateBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkUpdateRequest'
      responses:
        '200':
          description: Bookmark updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark or supplied category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Bookmarks]
      summary: Delete a bookmark
      operationId: deleteBookmark
      responses:
        '204':
          description: Bookmark deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bookmarks/{id}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: tagId
        in: path
        required: true
        description: The tag identifier.
        schema:
          $ref: '#/components/schemas/Cuid'
    delete:
      tags: [Bookmarks, Tags]
      summary: Remove a tag from a bookmark
      operationId: removeTagFromBookmark
      responses:
        '204':
          description: Tag association removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark/tag association was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bookmarks/{id}/process:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Bookmarks]
      summary: Process a bookmark
      description: Extracts the resource and runs AI classification for the bookmark.
      operationId: processBookmark
      responses:
        '200':
          description: Bookmark processed and classified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedBookmarkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The bookmark is already being processed or has a non-processable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: AI classification is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/bookmarks/{id}/correction:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Bookmarks]
      summary: Record a classification correction
      operationId: createBookmarkCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '201':
          description: Correction recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The bookmark was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/corrections:
    get:
      tags: [Personalization]
      summary: List the authenticated user's classification corrections
      operationId: listCorrections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/BookmarkLimit'
      responses:
        '200':
          description: A paginated list of the authenticated user's corrections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      responses:
        '200':
          description: The authenticated user's categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Categories]
      summary: Create a category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A category with that name already exists for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Categories]
      summary: Rename a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A category with that name already exists for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        '204':
          description: Category deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      parameters:
        - $ref: '#/components/parameters/TagLimit'
      responses:
        '200':
          description: The authenticated user's tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/collections:
    get:
      tags: [Collections]
      summary: List collections
      operationId: listCollections
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CollectionLimit'
      responses:
        '200':
          description: A paginated list of the authenticated user's collections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Collections]
      summary: Create a collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The supplied category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A collection with that name already exists for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/collections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Collections]
      summary: Get a collection and its bookmarks
      operationId: getCollection
      responses:
        '200':
          description: The requested collection with its bookmark memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The collection was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Collections]
      summary: Update a collection
      operationId: updateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '200':
          description: Collection updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The collection or supplied category was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A collection with that name already exists for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Collections]
      summary: Delete a collection
      operationId: deleteCollection
      responses:
        '204':
          description: Collection deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The collection was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/collections/{id}/bookmarks:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Collections]
      summary: Add a bookmark to a collection
      operationId: addBookmarkToCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMembershipRequest'
      responses:
        '201':
          description: Bookmark membership created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionMembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The collection or bookmark was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/collections/{id}/bookmarks/{bookmarkId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: bookmarkId
        in: path
        required: true
        description: The bookmark identifier.
        schema:
          type: string
          minLength: 1
    delete:
      tags: [Collections]
      summary: Remove a bookmark from a collection
      operationId: removeBookmarkFromCollection
      responses:
        '204':
          description: Bookmark membership removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The collection or membership was not found for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/collection-suggestions:
    get:
      tags: [CollectionSuggestions]
      summary: List AI-generated collection suggestions
      operationId: listCollectionSuggestions
      parameters:
        - $ref: '#/components/parameters/CollectionSuggestionStatus'
        - $ref: '#/components/parameters/CollectionLimit'
      responses:
        '200':
          description: Reviewable suggestions owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSuggestionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/collection-suggestions/generate:
    post:
      tags: [CollectionSuggestions]
      summary: Generate AI collection suggestions
      operationId: generateCollectionSuggestions
      responses:
        '201':
          description: New suggestions generated and stored for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSuggestionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/AIUnavailable'

  /api/collection-suggestions/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [CollectionSuggestions]
      summary: Accept a collection suggestion
      operationId: acceptCollectionSuggestion
      responses:
        '201':
          description: A manual-review-approved AI collection was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/collection-suggestions/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [CollectionSuggestions]
      summary: Reject a collection suggestion
      operationId: rejectCollectionSuggestion
      responses:
        '204':
          description: Suggestion rejected.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The resource identifier.
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    BookmarkLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of bookmarks to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CollectionLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of collections to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CategoryIdFilter:
      name: categoryId
      in: query
      required: false
      description: Filter bookmarks by category identifier.
      schema:
        $ref: '#/components/schemas/Cuid'
    TagFilter:
      name: tag
      in: query
      required: false
      description: Filter bookmarks by tag name.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    ProcessingStatusFilter:
      name: status
      in: query
      required: false
      description: Filter bookmarks by processing status.
      schema:
        $ref: '#/components/schemas/ProcessingStatus'
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search bookmark title, description, or canonical URL.
      schema:
        type: string
        maxLength: 200
    TagLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of tags to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    CollectionSuggestionStatus:
      name: status
      in: query
      required: false
      description: Filter collection suggestions by review status.
      schema:
        type: string
        enum: [PENDING, ACCEPTED, REJECTED]

  responses:
    BadRequest:
      description: The request is invalid or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentTooLarge:
      description: The resource exceeded the processing size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: The remote resource type or encoding is unsupported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The remote resource could not be safely processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: The remote resource could not be fetched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Processing or fetching the remote resource timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found for the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested operation conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AIUnavailable:
      description: AI processing is not configured or unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128

    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              $ref: '#/components/schemas/User'

    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'

    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]

    ProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    Cuid:
      type: string
      pattern: '^[cC][^\s-]{8,}$'
      description: Identifier accepted by the API's CUID validation.

    BookmarkCreateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute HTTP or HTTPS URL.
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 5000
        categoryId:
          allOf:
            - $ref: '#/components/schemas/Cuid'
          description: CUID of a category owned by the authenticated user.
        tags:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
