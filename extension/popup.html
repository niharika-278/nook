<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save to Nook</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img class="brand-mark" src="icon.png" alt="Nook">
        <div>
          <h1>Nook</h1>
          <p>Your little corner of the internet.</p>
        </div>
        <button id="logout-button" class="logout-button" type="button" hidden>Log out</button>
      </header>

      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <section id="auth-view" class="panel" aria-labelledby="auth-title">
        <h2 id="auth-title">Welcome back</h2>
        <p id="auth-intro" class="panel-intro">Sign in to save this page to your personal library.</p>
        <form id="auth-form" novalidate>
          <div id="display-name-field" class="field" hidden>
            <label for="display-name">Display name</label>
            <input id="display-name" name="displayName" type="text" autocomplete="name" maxlength="80">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="320">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          </div>
          <button id="auth-submit" class="primary-button" type="submit">Sign in</button>
        </form>
        <button id="auth-switch" class="text-link auth-switch" type="button">Need an account? Register</button>
      </section>

      <section id="save-view" class="panel" aria-labelledby="save-title" hidden>
        <h2 id="save-title">Save this page</h2>
        <p class="panel-intro">Nook will send only the page URL, title, and description.</p>
        <div id="page-card" class="page-card" hidden>
          <p class="page-label">Current page</p>
          <p id="page-title" class="page-title"></p>
          <p id="page-url" class="page-url"></p>
        </div>
        <button id="save-button" class="primary-button" type="button">Save current page</button>
      </section>

       <a id="app-link" class="app-link" href="http://localhost:5173" target="_blank" rel="noopener noreferrer">Open Nook web app</a>
      <button id="settings-link" class="settings-link" type="button">Extension settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
